Check:
  all:
  - name: define_dataset_name
    operator: equal_to
    value: RE
  - name: define_dataset_has_no_data
    operator: equal_to
    value: false
  - name: filename
    operator: empty
Core:
  Status: Draft
  Version: '1'
Description: RE dataset should be present in the submission when related data is collected
Executability: Fully Executable
Outcome:
  Message: Missing RE dataset.
  Output Variables:
  - RE
  - define_dataset_has_no_data
Rule Type: Domain Presence Check against Define XML
Scope:
  Classes:
    Include:
    - ALL
  Domains:
    Include:
    - ALL
Sensitivity: Study
